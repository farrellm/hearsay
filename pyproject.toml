[project]
name = "hearsay-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "worker"]

[tool.uv.sources]
hearsay-server = { workspace = true }
hearsay-worker = { workspace = true }

[dependency-groups]
dev = [
    "hearsay-server",
    "hearsay-worker",
    "httpx2>=2.13",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["spike"]  # throwaway Phase 0 scripts, kept as a record

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PTH", "ASYNC", "S", "N", "PL", "PT", "TID",
    "PERF", "RET", "PIE", "FURB", "LOG", "G", "DTZ", "ISC",
]
ignore = [
    "ASYNC109", # explicit `timeout` params on subprocess/HTTP wrappers are intentional
    "PLR2004", # magic values
    "S101",    # assert (used in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["hearsay", "hearsay_worker"]

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["S", "PLR"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = ["server/src", "worker/src"]
packages = ["hearsay", "hearsay_worker"]

[[tool.mypy.overrides]]
module = ["feedparser"]  # untyped; parser.py reads it as Any
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "worker/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
